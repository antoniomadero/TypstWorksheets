<svg width="700" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Obdélník reprezentující plátno -->
  <rect x="50" y="50" width="600" height="400" stroke="black" fill="lightgrey"/>
  
  <!-- Popisek [0,0] -->
  <text x="20" y="40" font-size="25" fill="black">[0,0]</text>

  <text x="560" y="480" font-size="25" fill="black">[width,height]</text>

  
  <!-- Osa X (doprava od [0,0]) -->
  <line x1="50" y1="50" x2="650" y2="50" stroke="black" marker-end="url(#arrow)"/>
  <text x="350" y="30" font-size="25" text-anchor="middle" fill="black">600 (width)</text>
  <text x="660" y="55" font-size="25" fill="black">X</text>
  
  <!-- Osa Y (dolů od [0,0]) -->
  <line x1="50" y1="50" x2="50" y2="450" stroke="black" marker-end="url(#arrow)"/>
  <text x="20" y="250" font-size="25" text-anchor="middle" fill="black" transform="rotate(-90,20,250)">400 (height)</text>
  <text x="40" y="470" font-size="25" fill="black">Y</text>
  
  <!-- Definice šipky -->
  <defs>
    <marker id="arrow" markerWidth="30" markerHeight="30" refX="30" refY="15" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,30 L30,15 z" fill="black"/>
    </marker>
  </defs>
</svg>