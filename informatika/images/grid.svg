<svg width="480" height="360" viewBox="0 0 480 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="black" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="360" fill="url(#grid)" stroke="black" stroke-width="1"/>
</svg>
