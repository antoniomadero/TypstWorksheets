<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Návrhy vizuální identity - Codestein</title>
                <style>
                        body {
                                    font-family: Arial, sans-serif;
                                                margin: 0;
                                                            padding: 20px;
                                                                    }

                                                                            h1 {
                                                                                        text-align: center;
                                                                                                    margin-bottom: 20px;
                                                                                                            }

                                                                                                                    .container {
                                                                                                                                display: flex;
                                                                                                                                            flex-direction: row;
                                                                                                                                                        justify-content: center;
                                                                                                                                                                    gap: 20px;
                                                                                                                                                                            }

                                                                                                                                                                                    .variant {
                                                                                                                                                                                                width: 30%;
                                                                                                                                                                                                            height: 300px;
                                                                                                                                                                                                                        border-radius: 10px;
                                                                                                                                                                                                                                    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                                                                                                                                                                                                                                                display: flex;
                                                                                                                                                                                                                                                            justify-content: center;
                                                                                                                                                                                                                                                                        align-items: center;
                                                                                                                                                                                                                                                                                    padding: 20px;
                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                    .logo-placeholder {
                                                                                                                                                                                                                                                                                                                width: 150px;
                                                                                                                                                                                                                                                                                                                            height: 150px;
                                                                                                                                                                                                                                                                                                                                        border-radius: 5px;
                                                                                                                                                                                                                                                                                                                                                    background-color: #eee;
                                                                                                                                                                                                                                                                                                                                                                color: #333;
                                                                                                                                                                                                                                                                                                                                                                            text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                        font-size: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                    display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                justify-content: center;
                                                                                                                                                                                                                                                                                                                                                                                                                            align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                            /* Varianta 1: Temná a kybernetická */
                                                                                                                                                                                                                                                                                                                                                                                                                                                    .variant1 {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                background-image: linear-gradient(135deg, #111111 0%, #000033 100%);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                /* Varianta 2: Moderní a svěží */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .variant2 {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    background-image: linear-gradient(135deg, #1A237E 0%, #00BCD4 100%);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    /* Varianta 3: Odvážná a energická */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .variant3 {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        background-image: linear-gradient(135deg, #4A148C 0%, #FF9800 100%);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h1>Návrhy vizuální identity - Codestein</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="variant variant1">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="logo-placeholder">Logo Codestein</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="variant variant2">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="logo-placeholder">Logo Codestein</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="variant variant3">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="logo-placeholder">Logo Codestein</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
