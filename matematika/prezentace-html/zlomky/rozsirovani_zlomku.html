<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vizualizace rovnosti zlomků</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #0f172a;
            margin-bottom: 5px;
            text-align: center;
        }
        p.subtitle {
            color: #64748b;
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
        }
        .fraction-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 600;
        }
        input[type="number"] {
            width: 80px;
            padding: 8px;
            font-size: 1.1rem;
            text-align: center;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="number"]:focus {
            border-color: #3b82f6;
        }
        .fraction-line {
            width: 90px;
            height: 3px;
            background-color: #1e293b;
            margin: 8px 0;
        }
        canvas {
            margin-top: 10px;
            background-color: #ffffff;
        }
        .status-banner {
            margin-top: 30px;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .equal {
            background-color: #dcfce7;
            color: #166534;
            border: 2px solid #bbf7d0;
        }
        .not-equal {
            background-color: #fee2e2;
            color: #991b1b;
            border: 2px solid #fecaca;
        }
    </style>
</head>
<body>
    <h1>Porovnání a rozšiřování zlomků</h1>
    <p class="subtitle">Zadejte dva zlomky a sledujte, zda představují stejnou část celku.</p>

    <div class="container">
        <!-- Zlomek 1 -->
        <div class="fraction-card">
            <div class="input-group">
                <label for="c1">Čitatel:</label>
                <input type="number" id="c1" value="2" min="0" oninput="updateVisualization()">
                <div class="fraction-line"></div>
                <label for="j1">Jmenovatel:</label>
                <input type="number" id="j1" value="4" min="1" oninput="updateVisualization()">
            </div>
            <canvas id="canvas1" width="220" height="220"></canvas>
        </div>

        <!-- Zlomek 2 -->
        <div class="fraction-card">
            <div class="input-group">
                <label for="c2">Čitatel:</label>
                <input type="number" id="c2" value="36" min="0" oninput="updateVisualization()">
                <div class="fraction-line"></div>
                <label for="j2">Jmenovatel:</label>
                <input type="number" id="j2" value="72" min="1" oninput="updateVisualization()">
            </div>
            <canvas id="canvas2" width="220" height="220"></canvas>
        </div>
    </div>

    <div id="status" class="status-banner"></div>

    <script>
        function drawPieChart(canvasId, numerator, denominator) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            const cx = 110;
            const cy = 110;
            const r = 95;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ošetření hodnot
            if (isNaN(denominator) || denominator <= 0) denominator = 1;
            if (isNaN(numerator) || numerator < 0) numerator = 0;
            if (numerator > denominator) numerator = denominator;

            // Pozadí kruhu
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, 2 * Math.PI);
            ctx.fillStyle = '#f1f5f9';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#cbd5e1';
            ctx.stroke();

            if (denominator === 1) {
                if (numerator === 1) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                    ctx.fillStyle = '#3b82f6';
                    ctx.fill();
                }
                return;
            }

            // Vykreslení výsečí
            for (let i = 0; i < denominator; i++) {
                const angle1 = (i * 2 * Math.PI) / denominator - Math.PI / 2;
                const angle2 = ((i + 1) * 2 * Math.PI) / denominator - Math.PI / 2;

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, angle1, angle2);
                ctx.closePath();

                ctx.fillStyle = i < numerator ? '#3b82f6' : '#ffffff';
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#94a3b8';
                ctx.stroke();
            }
        }

        function updateVisualization() {
            const c1 = parseInt(document.getElementById('c1').value) || 0;
            const j1 = parseInt(document.getElementById('j1').value) || 1;
            const c2 = parseInt(document.getElementById('c2').value) || 1;
            const j2 = parseInt(document.getElementById('j2').value) || 1;

            drawPieChart('canvas1', c1, j1);
            drawPieChart('canvas2', c2, j2);

            const statusBanner = document.getElementById('status');
            
            // Porovnání zlomků přes křížové násobení
            if (c1 * j2 === c2 * j1) {
                statusBanner.className = "status-banner equal";
                statusBanner.innerText = "✓ Zlomky jsou rovnocenné (vybarvená plocha je stejná)!";
            } else {
                statusBanner.className = "status-banner not-equal";
                statusBanner.innerText = "✗ Zlomky nejsou stejné (vybarvené plochy se liší).";
            }
        }

        // Spustit po načtení stránky
        window.onload = updateVisualization;
    </script>
</body>
</html>
