<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Krácení zlomků</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css">
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <div class="reveal">
        <div class="slides">
            <section>
                <p class="subtitle">Matematika</p>
                <h1>Krácení <span class="accent">zlomků</span></h1>
                <p class="subtitle">Čitatele i jmenovatele dělíme stejným číslem.</p>
            </section>

            <section>
                <h2>Krácení zlomků</h2>
                <div class="lesson">
                    <p>Čitatele i jmenovatele vydělíme číslem <strong class="accent">6</strong>:</p>
                    <img src="./zlomky_1.svg" alt="Ukázka krácení zlomků">
                </div>
            </section>

            <section>
                <h2>Krácení zlomků</h2>
                <div class="lesson">
                    <p>Čitatele i jmenovatele vydělíme číslem <strong class="accent">3</strong>:</p>
                    <video controls preload="metadata">
                        <source src="zlomky_1.mp4" type="video/mp4">
                        Váš prohlížeč nepodporuje přehrávání videa.
                    </video>
                </div>
            </section>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
    <script>
        Reveal.initialize({
            controls: true,
            progress: true,
            hash: true,
            center: true,
            transition: "slide"
        });
    </script>
</body>
</html>
