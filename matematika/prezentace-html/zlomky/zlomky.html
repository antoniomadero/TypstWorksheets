<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Krácení zlomků</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css">
    <style>
        :root {
            --ink: #18324b;
            --accent: #087e8b;
            --paper: #f5f8fc;
        }

        body {
            background: var(--paper);
        }

        .reveal {
            color: var(--ink);
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 30px;
        }

        .reveal h1,
        .reveal h2 {
            color: var(--ink);
            font-weight: 700;
            text-transform: none;
        }

        .reveal h1 {
            font-size: 2.2em;
        }

        .reveal h2 {
            font-size: 1.5em;
        }

        .reveal .accent {
            color: var(--accent);
        }

        .reveal .subtitle {
            color: #52677c;
            font-size: 1.05em;
        }

        .reveal .lesson {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: center;
            gap: 1.5em;
            text-align: left;
        }

        .reveal .lesson p {
            font-size: 1.05em;
            line-height: 1.45;
        }

        .reveal .lesson img,
        .reveal .lesson video {
            display: block;
            width: 100%;
            max-height: 58vh;
            margin: 0 auto;
            object-fit: contain;
        }

        .reveal .lesson img {
            background: #fff;
            border-radius: 0.25em;
        }

        .reveal .lesson video {
            border-radius: 0.25em;
        }

        .reveal .controls,
        .reveal .progress {
            color: var(--accent);
        }

        @media (max-width: 700px) {
            .reveal {
                font-size: 24px;
            }

            .reveal .lesson {
                grid-template-columns: 1fr;
                gap: 0.5em;
            }

            .reveal .lesson img,
            .reveal .lesson video {
                max-height: 40vh;
            }
        }
    </style>
</head>
<body>
    <div class="reveal">
        <div class="slides">
            <section>
                <p class="subtitle">Matematika</p>
                <h1>Krácení <span class="accent">zlomků</span></h1>
                <p class="subtitle">Čitatele i jmenovatele dělíme stejným číslem.</p>
            </section>

            <section>
                <h2>Krácení zlomků</h2>
                <div class="lesson">
                    <p>Čitatele i jmenovatele vydělíme číslem <strong class="accent">6</strong>:</p>
                    <img src="./zlomky_1-1.svg" alt="Ukázka krácení zlomků">
                </div>
            </section>

            <section>
                <h2>Krácení zlomků</h2>
                <div class="lesson">
                    <p>Čitatele i jmenovatele vydělíme číslem <strong class="accent">3</strong>:</p>
                    <video controls preload="metadata">
                        <source src="zlomky_1.mp4" type="video/mp4">
                        Váš prohlížeč nepodporuje přehrávání videa.
                    </video>
                </div>
            </section>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
    <script>
        Reveal.initialize({
            controls: true,
            progress: true,
            hash: true,
            center: true,
            transition: "slide"
        });
    </script>
</body>
</html>
